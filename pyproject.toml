[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "layerhop"
version = "0.4.0"
description = "LayerHop SDK - best-price cross-chain and same-chain swaps (sync + async, httpx)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "LayerHop", email = "dev@layerhop.com" }]
dependencies = ["httpx>=0.24,<1", "typing_extensions>=4.5; python_version < \"3.11\""]
keywords = ["layerhop", "bridge", "swap", "cross-chain", "solana", "evm", "ethereum", "defi", "web3", "dex-aggregator", "bridge-aggregator", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
dev = ["pytest>=7", "anyio>=4"]

[project.urls]
Homepage = "https://layerhop.com"
Changelog = "https://docs.layerhop.com/changelog"
Documentation = "https://docs.layerhop.com/sdks/python"
Repository = "https://github.com/layerhop/layerhop-python"
Issues = "https://github.com/layerhop/layerhop-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/layerhop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
