[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "layerhop"
version = "0.1.0"
description = "LayerHop SDK - best-price cross-chain and same-chain swaps (sync + async, httpx)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1", "typing_extensions>=4.5; python_version < \"3.11\""]
keywords = ["layerhop", "bridge", "swap", "cross-chain", "solana", "evm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Framework :: AsyncIO",
]

[project.optional-dependencies]
dev = ["pytest>=7", "anyio>=4"]

[project.urls]
Homepage = "https://layerhop.com"
Documentation = "https://docs.layerhop.com/sdks/python"

[tool.hatch.build.targets.wheel]
packages = ["src/layerhop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
