name: Release
# Builds and publishes to PyPI when a version tag is pushed: with the PYPI_API_TOKEN secret when it is
# set, otherwise via trusted publishing (OIDC). A version that is already on PyPI is skipped.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - id: check
        run: |
          v="${GITHUB_REF_NAME#v}"
          if curl -fsS "https://pypi.org/pypi/layerhop/$v/json" >/dev/null 2>&1; then echo "layerhop $v is already on PyPI"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.skip != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
